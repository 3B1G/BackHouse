[project]
name = "restaurant-bookkeeper"
version = "0.1.0"
description = "ASI-powered restaurant bookkeeping uAgent"
requires-python = ">=3.13,<3.14"
dependencies = ["uagents==0.26.1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "python-dotenv>=1,<2"]

[project.scripts]
bookkeeper = "bookkeeper.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookkeeper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

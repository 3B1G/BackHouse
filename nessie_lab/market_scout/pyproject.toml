[project]
name = "restaurant-market-scout"
version = "0.1.0"
description = "Market scout uAgent: our dish prices against relevant nearby competitors"
requires-python = ">=3.13,<3.14"
dependencies = ["uagents==0.26.1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "python-dotenv>=1,<2",
                "beautifulsoup4>=4.12,<5", "apify-client>=1.8,<3", "pypdf>=5,<7",
                "restaurant-cost-price"]

[project.scripts]
market-scout = "market_scout.cli:main"

[tool.uv.sources]
restaurant-cost-price = { path = "../cost_price", editable = true }

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_scout"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

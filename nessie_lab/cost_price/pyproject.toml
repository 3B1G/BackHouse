[project]
name = "restaurant-cost-price"
version = "0.1.0"
description = "The cost/price database: our menu prices and costs, competitor prices, and approved price changes"
requires-python = ">=3.13,<3.14"
dependencies = ["cryptography>=44,<47"]   # Ed25519 owner signatures, AES-GCM key sealing; the rest is stdlib

[project.scripts]
cost-price = "cost_price.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cost_price"]

[tool.pytest.ini_options]
testpaths = ["tests"]
